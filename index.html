<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Freedom Loading · Depot-Tagesbericht</title>
<style>
/* ============================================================
   ⛔️  AB HIER NICHTS ÄNDERN — NUR DAS report-OBJEKT GANZ UNTEN.
   Layout, Farben, Schriftgrößen sind bewusst fixiert.
   ============================================================ */
:root{
  --bg:#14160f;        /* tiefes Oliv-Schwarz   */
  --surface:#1d2016;   /* Karten                */
  --raised:#23271a;    /* Index-Strip           */
  --line:#34382a;      /* Haarlinien            */
  --ink:#e9e7da;       /* Text primär (warmes Bein) */
  --muted:#989a82;     /* Text gedämpft         */
  --sage:#a4ac82;      /* Marken-Oliv / Eyebrows*/
  --up:#8fc97a;        /* Gewinn                */
  --down:#d98b6f;      /* Verlust (Terracotta)  */
  --flat:#a4ac82;      /* neutral               */
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  line-height:1.45;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.wrap{max-width:460px;margin:0 auto;padding:22px 18px 40px}

/* ---- Kopf -------------------------------------------------- */
.brand{
  font-size:13px;font-weight:700;letter-spacing:.32em;
  color:var(--sage);text-transform:uppercase;
}
.brand span{opacity:.55}
.doctype{
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-top:10px;
}
.date{font-size:19px;font-weight:600;margin-top:3px;letter-spacing:-.01em}
.session{font-size:12px;color:var(--muted);margin-top:2px}
.headline{
  font-size:13px;color:var(--ink);margin-top:14px;
  padding-top:14px;border-top:1px solid var(--line);line-height:1.5;
}

/* ---- Eyebrow / Sektion ------------------------------------ */
.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--sage);margin:30px 0 12px;font-weight:600;
}

/* ---- Index-Strip ------------------------------------------ */
.strip{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;
}
.cell{background:var(--raised);padding:11px 13px}
.cell .lbl{font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.cell .val{font-size:18px;font-weight:600;margin-top:3px}
.cell .chg{font-size:12px;margin-top:1px}

/* ---- Position --------------------------------------------- */
.pos{
  background:var(--surface);border:1px solid var(--line);
  border-left-width:3px;border-radius:8px;padding:13px 15px;margin-bottom:9px;
}
.pos.bullish{border-left-color:var(--up)}
.pos.neutral{border-left-color:var(--flat)}
.pos.bearish{border-left-color:var(--down)}
.pos-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tkr{font-size:15px;font-weight:700;letter-spacing:.02em}
.nm{font-size:11px;color:var(--muted);margin-top:1px}
.px{font-size:23px;font-weight:600;text-align:right;line-height:1}
.chg{font-size:13px;font-weight:500}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.pos-mid{
  margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
}
.badge{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  padding:3px 8px;border-radius:4px;
}
.badge.bullish{color:var(--up);background:rgba(143,201,122,.12)}
.badge.neutral{color:var(--flat);background:rgba(164,172,130,.12)}
.badge.bearish{color:var(--down);background:rgba(217,139,111,.13)}
.news{margin-top:11px;list-style:none}
.news li{
  font-size:13px;color:var(--muted);line-height:1.5;
  padding-left:14px;position:relative;margin-top:6px;
}
.news li::before{content:"–";position:absolute;left:0;color:var(--sage)}

/* ---- Ausblick --------------------------------------------- */
.outlook{
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;
}
.outlook h3{font-size:14px;font-weight:700;color:var(--sage);margin-bottom:9px;letter-spacing:.01em}
.outlook p{font-size:14px;color:var(--ink);line-height:1.6}

.foot{
  margin-top:30px;padding-top:14px;border-top:1px solid var(--line);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  display:flex;justify-content:space-between;
}

/* ---- Druck: A4 Hochformat --------------------------------- */
@page{size:A4 portrait;margin:14mm}
@media print{
  body{background:#fff;color:#1a1c14}
  .wrap{max-width:none;padding:0}
  .pos,.outlook,.cell{background:#f5f5ef}
  .strip,.pos,.outlook{border-color:#d8d8cc}
  .date,.tkr,.px,.val{color:#1a1c14}
  .nm,.session,.news li{color:#5a5c4e}
  .up{color:#3f7a2c}.down{color:#b1543a}.flat,.sage,.brand,.eyebrow,.outlook h3{color:#6a7048}
}
</style>
</head>
<body>
<div class="wrap" id="report"></div>

<script>
/* ════════════════════════════════════════════════════════════
   ✅  NUR DIESES OBJEKT BEFÜLLEN. Sonst nichts im Dokument ändern.

   Regeln:
   • dir:  "up" | "down" | "flat"   → steuert Farbe + Pfeil
   • sentiment: "bullish" | "neutral" | "bearish" → steuert Schiene + Badge
   • Zahlen als String, deutsches Format (Komma, Minuszeichen −)
   • news: 0–3 kurze Punkte pro Position. Leeres [] = keine.
   • Positionen: Reihenfolge frei, Einträge dürfen weg.
   • KEINE Einstands-/Gewinn-Felder. Dieser Bericht ist öffentlich erreichbar.
   ════════════════════════════════════════════════════════════ */
const report = {
  date:    "Donnerstag, 30. Juli 2026",
  session: "US-Handelsschluss",
  headline:"EUR/USD 1,1525  ·  Fed hält Zinsen, Big-Tech-Rally nach starken Microsoft-Zahlen  ·  Chip-Aktien erholen sich kräftig  ·  Amazon- und Apple-Zahlen nach Handelsschluss",

  indices: [
    { lbl:"S&P 500",     val:"7.437,63",  chg:"+1,70 %",  dir:"up"   },
    { lbl:"NASDAQ 100",  val:"28.031,60", chg:"+3,21 %",  dir:"up"   },
    { lbl:"VIX",         val:"17,09",     chg:"−17,27 %", dir:"down" },
    { lbl:"BTC",         val:"64.839 $",  chg:"+1,46 %",  dir:"up"   },
  ],

  positions: [
    {
      tkr:"PLTR", nm:"Palantir · NASDAQ",
      px:"122,26 $", chg:"−0,60 %", dir:"down", sentiment:"neutral",
      news:[
        "Q2-Zahlen für den 3. August terminiert, Investoren positionieren sich vorsichtig; Michael Burry bekräftigt seine Short-Wette.",
        "Aktie nahe 52-Wochen-Tief, Analysten bleiben aber mehrheitlich bei Kaufempfehlungen trotz hoher Bewertung.",
      ],
    },
    {
      tkr:"TSLA", nm:"Tesla · NASDAQ",
      px:"308,85 $", chg:"+3,53 %", dir:"up", sentiment:"bullish",
      news:[
        "Tesla meldet Produktion des zehnmillionsten Elektrofahrzeugs, sechs Jahre nach der ersten Million.",
        "Erholung im Sog der breiten Tech-Rally nach starken Microsoft-Zahlen; europäische FSD-Daten bestätigen gute Sicherheitswerte.",
      ],
    },
    {
      tkr:"NVDA", nm:"NVIDIA · NASDAQ",
      px:"195,04 $", chg:"+2,65 %", dir:"up", sentiment:"bullish",
      news:[
        "Chip-Sektor erholt sich kräftig nach starken Microsoft-Cloud-Zahlen, befeuert neuen KI-Infrastruktur-Optimismus.",
        "Bericht: Nvidia in Gesprächen über einen 250-Mrd.-Dollar-Backstop für ein OpenAI-Rechenzentrumsprojekt in Ohio.",
      ],
    },
    {
      tkr:"ASML", nm:"ASML Holding · Euronext (EUR)",
      px:"1.405,40 €", chg:"+3,17 %", dir:"up", sentiment:"bullish",
      news:[
        "Aktie erholt sich mit dem breiten Halbleiter-Rebound, nachdem zuletzt Sorgen um chinesische Konkurrenz belasteten.",
        "China-Exportkontrollen und wachsender Wettbewerb durch chinesische EUV-Alternativen bleiben strukturelles Risiko im Hintergrund.",
      ],
    },
    {
      tkr:"AMZN", nm:"Amazon · NASDAQ",
      px:"235,50 $", chg:"+3,90 %", dir:"up", sentiment:"bullish",
      news:[
        "Q2-Zahlen nach Handelsschluss: Umsatz von 200,6 Mrd. Dollar und EPS von 5,75 Dollar deutlich über dem Konsens von 1,82 Dollar.",
        "AWS wächst 36,7 Prozent – schnellstes Wachstum seit 18 Quartalen – getrieben von KI-Nachfrage.",
      ],
    },
    {
      tkr:"AMD", nm:"Adv. Micro Devices · NASDAQ",
      px:"485,46 $", chg:"+13,01 %", dir:"up", sentiment:"bullish",
      news:[
        "Kräftige Erholung nach fünf Verlusttagen, angetrieben von starken Microsoft-Cloud-Zahlen und der Chip-Sektor-Rally.",
        "Susquehanna erhöht Kursziel auf 500 Dollar; 14-Mrd.-Dollar-Rechenzentrumsdeal mit Core Scientific stützt Wachstumsstory.",
      ],
    },
    {
      tkr:"GOOGL", nm:"Alphabet · NASDAQ",
      px:"334,95 $", chg:"−0,52 %", dir:"down", sentiment:"neutral",
      news:[
        "Aktie fällt leicht, während Microsoft trotz vergleichbar starker Cloud-Zahlen deutlich zulegt.",
        "Hoher Capex-Ausblick (195–205 Mrd. Dollar) und negativer Free Cashflow belasten weiter die Anlegerstimmung.",
      ],
    },
    {
      tkr:"SPCX", nm:"SpaceX · NASDAQ",
      px:"112,20 $", chg:"−0,31 %", dir:"down", sentiment:"bearish",
      news:[
        "Aktie nahe Rekordtief; Short-Seller bauen Wetten von über 26 Mrd. Dollar vor dem Lock-up-Ablauf am 6. August weiter aus.",
        "US Space Force erteilt 1,6-Mrd.-Dollar-Auftrag für 18 Falcon-9-Starts, stützt den Kurs nur leicht.",
      ],
    },
  ],

  outlook: {
    title:"Freitag im Fokus",
    body:"Die nach Handelsschluss veröffentlichten Amazon- und Apple-Zahlen dürften den Handel am Freitag prägen. Im Energiesektor legen ExxonMobil und Chevron Quartalszahlen vor, zudem steht der finale University-of-Michigan-Konsumentenvertrauensindex für Juli an. Die Ölpreise bleiben wegen der eskalierenden US-Iran-Spannungen erhöht, was die Stimmung belasten könnte. Der starke Chip-Sektor-Rebound vom Donnerstag bleibt ebenfalls im Fokus, nachdem Microsofts Cloud-Zahlen die Runde beflügelt hatten.",
  },
};

/* ---- Render (nicht anfassen) ------------------------------ */
const arrow = d => d==="up"?"▲":d==="down"?"▼":"■";
const cls   = d => d==="up"?"up":d==="down"?"down":"flat";
const esc   = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function render(r){
  const idx = r.indices.map(i=>`
    <div class="cell">
      <div class="lbl">${esc(i.lbl)}</div>
      <div class="val mono">${esc(i.val)}</div>
      <div class="chg ${cls(i.dir)}">${arrow(i.dir)} ${esc(i.chg)}</div>
    </div>`).join("");

  const pos = r.positions.map(p=>`
    <div class="pos ${p.sentiment}">
      <div class="pos-top">
        <div><div class="tkr">${esc(p.tkr)}</div><div class="nm">${esc(p.nm)}</div></div>
        <div><div class="px mono">${esc(p.px)}</div>
             <div class="chg ${cls(p.dir)}" style="text-align:right">${arrow(p.dir)} ${esc(p.chg)}</div></div>
      </div>
      <div class="pos-mid"><span class="badge ${p.sentiment}">${esc(p.sentiment)}</span></div>
      ${p.news&&p.news.length?`<ul class="news">${p.news.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
    </div>`).join("");

  return `
    <div class="brand">Freedom <span>Loading</span></div>
    <div class="doctype">Depot-Tagesbericht</div>
    <div class="date">${esc(r.date)}</div>
    <div class="session">${esc(r.session)}</div>
    <div class="headline">${esc(r.headline)}</div>

    <div class="eyebrow">Markt</div>
    <div class="strip">${idx}</div>

    <div class="eyebrow">Depot</div>
    ${pos}

    <div class="eyebrow">Ausblick</div>
    <div class="outlook"><h3>${esc(r.outlook.title)}</h3><p>${esc(r.outlook.body)}</p></div>

    <div class="foot"><span>Freedom Loading</span><span>${esc(r.date)}</span></div>`;
}

document.getElementById("report").innerHTML = render(report);
</script>
</body>
</html>
